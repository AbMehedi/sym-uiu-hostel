# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # B-24: Explicit session security configuration
    session:
        gc_maxlifetime: 3600       # 1-hour idle expiry
        cookie_secure: 'auto'      # HTTPS-only in prod, relaxed in dev
        cookie_httponly: true      # not accessible via JavaScript
        cookie_samesite: 'lax'     # CSRF protection baseline

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
